name: WearFiles Auto APK
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-37.1"
      - name: Build both APKs
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug :wearable:assembleDebug -PappVersionName=1.0.0 -PappVersionCode=$((1000 + GITHUB_RUN_NUMBER * 2))
      - name: Name APKs
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk "dist/WearFiles-Auto-Mobile-v1.0.0-build${GITHUB_RUN_NUMBER}.apk"
          cp wearable/build/outputs/apk/debug/wearable-debug.apk "dist/WearFiles-Auto-WearOS-v1.0.0-build${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WearFiles-Auto-v1.0.0-build${{ github.run_number }}
          path: dist/*.apk
